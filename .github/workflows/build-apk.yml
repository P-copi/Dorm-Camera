name: Build Dorm Camera APK

on:
  push:
    branches: [ main, dev-v0.2.18 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.pcopi.dormcamera'" /tmp/badging.txt
          grep -q "versionCode='48'" /tmp/badging.txt
          grep -q "versionName='0.2.18'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.pcopi.dormcamera.BrandSplashActivity'" /tmp/badging.txt
          grep -q "application-icon-" /tmp/badging.txt
          grep -q "icon='res/drawable/dorm_camera_logo.xml'" /tmp/badging.txt

      - name: Prepare permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DORM_CAMERA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DORM_CAMERA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/.signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/.signing/dorm-camera-release.jks"
          test -s "$GITHUB_WORKSPACE/.signing/dorm-camera-release.jks"
          echo "DORM_CAMERA_KEYSTORE_PATH=$GITHUB_WORKSPACE/.signing/dorm-camera-release.jks" >> "$GITHUB_ENV"
          echo "DORM_CAMERA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build permanently signed release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify permanent release signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/release-badging.txt
          grep -q "package: name='com.pcopi.dormcamera'" /tmp/release-badging.txt
          grep -q "versionCode='48'" /tmp/release-badging.txt
          grep -q "versionName='0.2.18'" /tmp/release-badging.txt
          grep -q "launchable-activity: name='com.pcopi.dormcamera.BrandSplashActivity'" /tmp/release-badging.txt
          grep -q "application-icon-" /tmp/release-badging.txt

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dorm-Camera-V0.2.18-QR-Scanner-Permanent-Signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

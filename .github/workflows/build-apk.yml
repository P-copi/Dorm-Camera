name: Build Dorm Camera APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.pcopi.dormcamera'" /tmp/badging.txt
          grep -q "versionCode='5'" /tmp/badging.txt
          grep -q "versionName='0.1.4'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.pcopi.dormcamera.MainActivity'" /tmp/badging.txt

      - name: Prepare permanent signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DORM_CAMERA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DORM_CAMERA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            mkdir -p "$GITHUB_WORKSPACE/.signing"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/.signing/dorm-camera-release.jks"
            test -s "$GITHUB_WORKSPACE/.signing/dorm-camera-release.jks"
            echo "DORM_CAMERA_KEYSTORE_PATH=$GITHUB_WORKSPACE/.signing/dorm-camera-release.jks" >> "$GITHUB_ENV"
            echo "DORM_CAMERA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build permanently signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify permanent release signature
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/release-badging.txt
          grep -q "versionCode='5'" /tmp/release-badging.txt
          grep -q "versionName='0.1.4'" /tmp/release-badging.txt

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dorm-Camera-V0.1.4-Permanent-Signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug APK when permanent signing is not configured
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dorm-Camera-V0.1.4-Needs-Signing-Secrets-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
